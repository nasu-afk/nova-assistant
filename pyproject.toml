[project]
name = "nova-assistant"
version = "0.1.0"
description = "NOVA — a modular, security-first, voice-capable AI desktop assistant for Windows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hasan" }]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "aiosqlite>=0.20",
    "anthropic>=0.34",
    "groq>=0.11",
    "psutil>=6.0",
]

# Heavier / platform-specific dependencies are intentionally deferred to the
# phase that first needs them, per the phased build plan (see README.md).
# They are declared here as optional extras so `uv sync` in Phase 0 stays
# fast and does not require a Windows machine, a display server, audio
# devices, or a browser download.
[project.optional-dependencies]
gui = ["PySide6>=6.7", "qasync>=0.27"]
browser = ["playwright>=1.44"]
voice = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "numpy>=1.26",
    "pyttsx3>=2.90",
    "pynput>=1.7",
]
# openwakeword is intentionally NOT declared as a project extra here: uv
# resolves uv.lock for all platforms by default ("universal" locking), and
# openwakeword's own tflite-runtime dependency has no Python 3.12 wheel on
# Linux (it's Linux-only in openwakeword's metadata) — declaring it as an
# extra makes `uv sync` fail to resolve at all, even on Windows, even for
# people not requesting this extra. On Windows/macOS, where the tflite
# dependency doesn't apply and only onnxruntime (which has current wheels)
# is needed, just install it directly, bypassing the project's lockfile:
#   uv pip install openwakeword
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "PySide6>=6.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]
